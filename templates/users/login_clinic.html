{% extends 'base.html' %}
{% block title %}Вход для клиник — EKM-PET{% endblock %}
{% block content %}
<div class="card">
  <div class="text-center mb-0">
    <h1>🏥 Ветеринарные клиники</h1>
    <p>Войдите, чтобы управлять профилями и синхронизировать данные</p>
  </div>
  <form method="post" style="margin-top: 1.5rem;">
    {% csrf_token %}
    <div class="input-group">{{ form.username }}<label>Имя пользователя</label></div>
    <div class="input-group">{{ form.password }}<label>Пароль</label></div>
    <button type="submit" class="btn" style="width: 100%; background: #6f42c1;">Войти как клиника</button>
  </form>
  <div class="text-center mt-4">
    <p class="mb-0">
      Владелец питомца? <a href="{% url 'users:login_owner' %}" class="btn-link">Войти здесь</a>
    </p>
  </div>
</div>
{% endblock %}
